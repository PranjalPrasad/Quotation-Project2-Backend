spring.application.name=quotation2

server.port=8092

# ---- MySQL Database ----
spring.datasource.url=jdbc:mysql://localhost:3306/quotationdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ---- JWT ----
# secret must be at least 32 characters for HS256
jwt.secret=quotationdbSuperSecretKeyForJwtToken1234567890
jwt.expiration.ms=86400000

# ---- Dummy Admin (seeded on startup if not present) ----
admin.default.email=admin@gmail.com
admin.default.password=admin@1234

# ---- File Upload Configuration ----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.resolve-lazily=false
